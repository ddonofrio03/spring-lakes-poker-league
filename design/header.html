<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SLPL Header Generator</title>
<!--
  Draws the site header (1600x400) on a canvas.
  Usage: header.html?season=20&years=2008-2027&style=a
  Render to an image with headless Chrome (see design/README.md).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rye&family=Limelight&family=Playfair+Display+SC:wght@900&family=Cinzel+Decorative:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="400"></canvas>
<script>
const params = new URLSearchParams(location.search);
const SEASON = parseInt(params.get('season') || '20');
const YEARS = params.get('years') || `2008–2027`;
const STYLE = params.get('style') || 'f'; // f = Limelight, chosen for Season 20

// Font pairings: roman numeral / title
const STYLES = {
  a: { roman: '900 330px "Rockwell"',        title: 'bold 96px "Copperplate"',      titleSpacing: 6,  lineGap: 108 },
  b: { roman: '330px "Impact"',              title: '98px "Herculanum"',            titleSpacing: 4,  lineGap: 110 },
  c: { roman: '900 330px "Arial Black"',     title: 'bold 104px "Bodoni 72 Smallcaps"', titleSpacing: 5, lineGap: 112 },
  // Second round: Google fonts, chrome-and-glow title, sized to fit
  d: { roman: '900 330px "Arial Black"', title: '900 100px "Cinzel"',             titleSpacing: 4, lineGap: 116, chrome: true },
  e: { roman: '900 330px "Arial Black"', title: '100px "Rye"',                    titleSpacing: 3, lineGap: 118, chrome: true },
  f: { roman: '900 330px "Arial Black"', title: '100px "Limelight"',              titleSpacing: 4, lineGap: 116, chrome: true },
  g: { roman: '900 330px "Arial Black"', title: '900 100px "Playfair Display SC"', titleSpacing: 3, lineGap: 116, chrome: true },
};
const S = STYLES[STYLE] || STYLES.a;

function toRoman(n) {
  const map = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out = '';
  for (const [v, r] of map) while (n >= v) { out += r; n -= v; }
  return out;
}

// Small seeded RNG so the image comes out the same every time
let seed = 20;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// The artwork is 1600x400; PAD extra pixels on each side (more chips on
// the left, black on the right) let wide screens show more width instead
// of cropping the top and bottom. Phones see just the middle 1600.
const PAD = parseInt(params.get('pad') ?? '400');
const W = 1600 + PAD * 2, H = 400;
document.getElementById('c').width = W;
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// ─── Red chip stacks (blurred, like the old header) ───
function drawChip(g, x, y, w, h, turn, light) {
  // Cylinder shading: dark edges, bright middle
  const grad = g.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0,    `hsl(356, 85%, ${12 * light}%)`);
  grad.addColorStop(0.35, `hsl(356, 90%, ${42 * light}%)`);
  grad.addColorStop(0.55, `hsl(358, 95%, ${55 * light}%)`);
  grad.addColorStop(1,    `hsl(354, 85%, ${10 * light}%)`);
  g.fillStyle = grad;
  g.beginPath();
  g.roundRect(x, y, w, h, h * 0.35);
  g.fill();
  // White edge spots wrapping around the chip
  const spots = 8;
  for (let i = 0; i < spots; i++) {
    const a = turn + (i / spots) * Math.PI * 2;
    if (Math.cos(a) < 0.1) continue; // back side, hidden
    const cx = x + w / 2 + Math.sin(a) * w / 2 * 0.92;
    const sw = w * 0.11 * Math.cos(a);
    const lum = 70 + 30 * Math.cos(a);
    g.fillStyle = `hsla(20, 30%, ${lum * light}%, ${0.95})`;
    g.fillRect(cx - sw / 2, y + h * 0.18, sw, h * 0.64);
  }
  // Thin dark seam between chips
  g.fillStyle = 'rgba(0,0,0,0.55)';
  g.fillRect(x + 2, y + h - 1.5, w - 4, 1.5);
}

function drawStack(g, x, baseY, w, h, count, light) {
  let turn = rand() * Math.PI * 2;
  for (let i = 0; i < count; i++) {
    const jitter = (rand() - 0.5) * w * 0.06;
    turn += 0.6 + rand() * 0.9;
    drawChip(g, x + jitter, baseY - (i + 1) * h, w, h, turn, light);
  }
}

function layer(blur, fn) {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const g = off.getContext('2d');
  fn(g);
  ctx.save();
  ctx.filter = `blur(${blur}px)`;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

function background() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Far stacks: small, dark, very soft
  layer(7, g => {
    for (let x = -20; x < 900 + PAD; x += 30 + rand() * 26) {
      const w = 40 + rand() * 20, h = 11 + rand() * 3;
      drawStack(g, x, H * (0.55 + rand() * 0.45), w, h, 10 + Math.floor(rand() * 22), 0.7);
    }
  });
  // Middle stacks
  layer(3.5, g => {
    for (let x = -30; x < 820 + PAD; x += 52 + rand() * 40) {
      const w = 62 + rand() * 26, h = 16 + rand() * 4;
      drawStack(g, x, H + 10 - rand() * 90, w, h, 10 + Math.floor(rand() * 16), 0.95);
    }
  });
  // Near stacks: big, bright, slightly soft
  layer(1.6, g => {
    for (let x = -40; x < 700 + PAD; x += 95 + rand() * 70) {
      const w = 96 + rand() * 30, h = 24 + rand() * 4;
      drawStack(g, x, H + 40 - rand() * 50, w, h, 5 + Math.floor(rand() * 11), 1.1);
    }
  });

  // Sparkle: soft out-of-focus highlights
  layer(5, g => {
    for (let i = 0; i < 90; i++) {
      const x = rand() * (760 + PAD), y = rand() * H;
      g.fillStyle = rand() < 0.6 ? `rgba(255,${200 + rand() * 55},${190 + rand() * 60},${0.25 + rand() * 0.45})` : `rgba(255,40,40,${0.3 + rand() * 0.4})`;
      g.fillRect(x, y, 6 + rand() * 12, 4 + rand() * 8);
    }
  });

  // Warm bloom + fade to black under the title
  const bloom = ctx.createRadialGradient(330 + PAD, 220, 20, 330 + PAD, 220, 420);
  bloom.addColorStop(0, 'rgba(255,60,60,0.18)');
  bloom.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, W, H);

  const fade = ctx.createLinearGradient(440 + PAD, 0, 900 + PAD, 0);
  fade.addColorStop(0, 'rgba(0,0,0,0)');
  fade.addColorStop(0.55, 'rgba(0,0,0,0.85)');
  fade.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = fade;
  ctx.fillRect(0, 0, W, H);

  // Vignette top and bottom
  const v = ctx.createLinearGradient(0, 0, 0, H);
  v.addColorStop(0, 'rgba(0,0,0,0.45)');
  v.addColorStop(0.25, 'rgba(0,0,0,0)');
  v.addColorStop(0.8, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ─── Distressed roman numeral: black letters, white edge, white specks ───
function romanNumeral(text, cx, baseline) {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const g = off.getContext('2d');
  g.font = S.roman;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  // condense the letters a little so XX keeps the old block shape
  g.save();
  g.translate(cx, baseline);
  g.scale(0.92, 1);
  g.lineJoin = 'miter';
  g.lineWidth = 9;
  g.strokeStyle = '#fff';
  g.strokeText(text, 0, 0);
  g.fillStyle = '#060606';
  g.fillText(text, 0, 0);
  g.restore();

  // Specks only where the letters are
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 1400; i++) {
    const x = cx - 300 + rand() * 600, y = baseline - 280 + rand() * 300;
    const r = 0.8 + Math.pow(rand(), 3) * 6;
    g.fillStyle = `rgba(255,255,255,${0.55 + rand() * 0.45})`;
    g.beginPath();
    const pts = 5 + Math.floor(rand() * 3);
    for (let k = 0; k < pts; k++) {
      const a = (k / pts) * Math.PI * 2, rr = r * (0.5 + rand());
      k ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.fill();
  }
  // Chewed-up edges: knock out a few bites along the outline
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 260; i++) {
    const x = cx - 300 + rand() * 600, y = baseline - 280 + rand() * 300;
    g.beginPath();
    g.arc(x, y, 0.6 + rand() * 2.2, 0, Math.PI * 2);
    g.fill();
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 24;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

function years(text, cx, y) {
  ctx.save();
  ctx.font = 'bold 50px "DIN Condensed"';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '3px';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#fff';
  ctx.strokeText(text, cx, y);
  ctx.fillStyle = '#000';
  ctx.fillText(text, cx, y);
  ctx.restore();
}

function title(cx, y1, y2) {
  const lines = ['SPRING LAKES', 'POKER LEAGUE'];
  ctx.save();
  ctx.textAlign = 'center';
  ctx.letterSpacing = S.titleSpacing + 'px';
  // Shrink the font if the wider line would run past the chip area
  let font = S.title;
  ctx.font = font;
  const maxW = 700;
  const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
  if (widest > maxW) {
    font = font.replace(/(\d+)px/, (m, px) => Math.floor(px * maxW / widest) + 'px');
    ctx.font = font;
  }
  const ys = [y1, y2];

  if (!S.chrome) {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.75)';
    ctx.shadowBlur = 18;
    lines.forEach((l, i) => ctx.fillText(l, cx, ys[i]));
    ctx.shadowBlur = 0;
    lines.forEach((l, i) => ctx.fillText(l, cx, ys[i]));
    ctx.restore();
    return;
  }

  const size = parseInt(font.match(/(\d+)px/)[1]);
  lines.forEach((l, i) => {
    const y = ys[i];
    // soft red halo behind, then white glow
    ctx.shadowColor = 'rgba(230,30,40,0.55)';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#fff';
    ctx.fillText(l, cx, y);
    ctx.shadowColor = 'rgba(255,255,255,0.7)';
    ctx.shadowBlur = 14;
    ctx.fillText(l, cx, y);
    ctx.shadowBlur = 0;
    // chrome face: bright top, cool middle band, bright bottom edge
    const g = ctx.createLinearGradient(0, y - size * 0.78, 0, y + size * 0.05);
    g.addColorStop(0,    '#ffffff');
    g.addColorStop(0.45, '#f4f4f6');
    g.addColorStop(0.52, '#b9bcc4');
    g.addColorStop(0.75, '#e9eaee');
    g.addColorStop(1,    '#ffffff');
    ctx.fillStyle = g;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(40,0,0,0.55)';
    ctx.strokeText(l, cx, y);
    ctx.fillText(l, cx, y);
  });
  ctx.restore();
}

// ─── SLPL chip badge: tilted casino chip resting on a second chip ───
function chipFace(g, r, opts) {
  const { body, bodyDark, insert, ink } = opts;
  // body with rim shading
  const rg = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  rg.addColorStop(0, body);
  rg.addColorStop(1, bodyDark);
  g.fillStyle = rg;
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  // edge inserts (rounded blocks)
  for (let i = 0; i < 8; i++) {
    g.save();
    g.rotate((i / 8) * Math.PI * 2 + Math.PI / 8);
    g.fillStyle = insert;
    g.beginPath();
    g.roundRect(r * 0.76, -r * 0.12, r * 0.22, r * 0.24, r * 0.03);
    g.fill();
    // little stripe inside each insert
    g.fillStyle = bodyDark;
    g.fillRect(r * 0.86, -r * 0.12, r * 0.025, r * 0.24);
    g.restore();
  }
  // outer and inner rings
  g.strokeStyle = 'rgba(0,0,0,0.35)';
  g.lineWidth = r * 0.02;
  g.beginPath(); g.arc(0, 0, r * 0.985, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = insert;
  g.lineWidth = r * 0.025;
  g.beginPath(); g.arc(0, 0, r * 0.72, 0, Math.PI * 2); g.stroke();
  // inlay
  const ig = g.createRadialGradient(-r * 0.15, -r * 0.2, r * 0.05, 0, 0, r * 0.66);
  ig.addColorStop(0, '#fbf3df');
  ig.addColorStop(1, '#e6d3a8');
  g.fillStyle = ig;
  g.beginPath(); g.arc(0, 0, r * 0.66, 0, Math.PI * 2); g.fill();
  g.strokeStyle = ink;
  g.lineWidth = r * 0.018;
  g.beginPath(); g.arc(0, 0, r * 0.62, 0, Math.PI * 2); g.stroke();
}

function ringText(g, text, r, size, color) {
  g.save();
  g.font = `700 ${size}px "Cinzel", "Apple Symbols"`;
  g.fillStyle = color;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  const chars = [...text];
  const step = (Math.PI * 2) / chars.length;
  chars.forEach((ch, i) => {
    g.save();
    g.rotate(-Math.PI / 2 + i * step);
    g.translate(r, 0);
    g.rotate(Math.PI / 2);
    g.fillText(ch, 0, 0);
    g.restore();
  });
  g.restore();
}

function chipBadge(cx, cy, r) {
  const red   = { body: '#e0242c', bodyDark: '#7a0b10', insert: '#f6ecd4', ink: '#8f0d12' };
  const black = { body: '#3a3a3a', bodyDark: '#050505', insert: '#e8e8e8', ink: '#111' };

  // chip underneath, peeking out down-left, slightly tilted
  ctx.save();
  ctx.translate(cx + r * 0.5, cy + r * 0.42);
  ctx.rotate(0.6);
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  chipFace(ctx, r * 0.92, black);
  ctx.restore();

  // main chip: edge thickness first, then the face
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(0.18);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.95)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetX = -6;
  ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#5c070b';
  ctx.beginPath(); ctx.ellipse(0, r * 0.07, r, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  chipFace(ctx, r, red);

  // center: suits, SLPL, season
  ctx.fillStyle = '#8f0d12';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${r * 0.34}px "Cinzel"`;
  const tg = ctx.createLinearGradient(0, -r * 0.15, 0, r * 0.15);
  tg.addColorStop(0, '#f7d774');
  tg.addColorStop(0.5, '#c8962c');
  tg.addColorStop(1, '#8a5d12');
  ctx.lineWidth = r * 0.03;
  ctx.strokeStyle = '#5a0a0d';
  ctx.strokeText('SLPL', 0, r * 0.02);
  ctx.fillStyle = tg;
  ctx.fillText('SLPL', 0, r * 0.02);
  ringText(ctx, '\u2660 SPRING LAKES \u2665 EST. 2008 ', r * 0.515, r * 0.11, '#7a0b10');

  // gloss
  const gl = ctx.createLinearGradient(-r, -r, r * 0.4, r * 0.4);
  gl.addColorStop(0, 'rgba(255,255,255,0.35)');
  gl.addColorStop(0.45, 'rgba(255,255,255,0.06)');
  gl.addColorStop(0.5, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

async function render() {
  await Promise.all([
    document.fonts.load(S.roman, 'XVI'),
    document.fonts.load(S.title, 'SPRING LAKES POKER LEAGUE'),
    document.fonts.load('bold 50px "DIN Condensed"', '0123456789'),
    document.fonts.load('900 40px "Cinzel"', 'SLPL'),
    document.fonts.load('700 20px "Cinzel"', 'SPRING'),
  ]);
  background();
  romanNumeral(toRoman(SEASON), 315 + PAD, 322);
  years(YEARS, 315 + PAD, 385);
  title(1030 + PAD, 165, 165 + S.lineGap);
  chipBadge(1488 + PAD, 292, 90);
  document.title = 'ready';
}
render();
</script>
</body>
</html>
